<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" href="css/mafie.css">
	<title>My Google Map</title>
	<style>
		
	#wrapper{
		width: 850px;
		height: 600px;
		background-color: lightblue;
		margin: 0 auto;
		overflow: hidden;
	}
	#map{
		width: 700px;
		height: 500px;
		background-color: #ccc;
		margin: 30px auto;
	}	
	.home{
		background-color: skyblue;
		text-decoration: none;
		text-align: center;
	
	
	}
	.title{
		background-color:  #8E7618;	
	
	}
	
	.home a{
		text-decoration: none;
		color: white;
	}
	
	.home a:hover {
		color: green;
		text-transform: uppercase;
	}
	
	@media screen and (min-width: 400px) {
		body {
			background-color: lightgreen;
		}
	}

	@media screen and (min-width: 800px) {
	body {
		background-color: gray;
		}
	}
	
	</style>
</head>

	

<body>

<h1 class="title">My Google Map</h1>
	<nav id="main-navbar">
      <ul>
        <li><a href="bitcoin.html">History of Bitcoin</a></li>

	  </ul>
    </nav>
<h1 class="home"><a href="index.html">Home</a></h1>

<div id="wrapper">
<div id="map"></div>
</div>
<script>
	function initMap(){
		const coords = { lat: 14.5996, lng: 120.9858}
		
		const map = new google.maps.Map(
			document.getElementById("map"),{
				center: coords,
				zoom: 7
				
		});
		const maker = new google.maps.Marker({
		
		position: coords,
		map: map,
		title:"Philippines",
		animation: google.maps.Animation.Drop
		});
			
	}
</script>

<script>
	function initMap(){
		const quezon = { lat: 14.649285913774557, lng: 121.04917683344364}
		
		const map = new google.maps.Map(
			document.getElementById("map"),{
				center: quezon,
				zoom: 7
				
		});
		const maker = new google.maps.Marker({
		position: quezon,
		map: map,
		title:"quezon",
		animation: google.maps.Animation.Drop
		});
			
	}
</script>


<script async defer
	src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDkO3BaHyQb4eOXup6T12qyp79KP3yLVVU&callback=initMap"></script>
